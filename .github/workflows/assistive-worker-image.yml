name: Assistive Executor Images

# Reproducible build of the two executor images.
#
# Manual only, and publishing is opt-in and off by default: a maintainer must deliberately request
# it after reviewing the third-party redistribution position recorded in
# docs/handover/third-party-licences.md. A build alone proves the pinned provider artifact hashes
# and exports local OCI evidence whose manifest digests the infrastructure template can be pinned to.

on:
  workflow_dispatch:
    inputs:
      build_worker:
        description: Build the heavy assistive worker image
        type: boolean
        default: true
      build_dispatcher:
        description: Build the scheduled dispatcher image
        type: boolean
        default: true
      publish:
        description: Publish to the container registry (requires reviewed licence clearance)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-only:
    name: Build executor images
    if: ${{ !inputs.publish }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Build heavy assistive worker image
        if: inputs.build_worker
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        id: worker
        with:
          context: .
          file: ./apps/assistive-worker/Dockerfile.hosted
          platforms: linux/amd64
          provenance: false
          push: false
          tags: ghcr.io/${{ github.repository }}/capstone-assistive-worker:${{ github.sha }}
          outputs: type=oci,dest=/tmp/capstone-assistive-worker.oci.tar

      - name: Build scheduled dispatcher image
        if: inputs.build_dispatcher
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        id: dispatcher
        with:
          context: .
          file: ./apps/assistive-worker/Dockerfile.dispatcher
          platforms: linux/amd64
          provenance: false
          push: false
          tags: ghcr.io/${{ github.repository }}/capstone-assistive-dispatcher:${{ github.sha }}
          outputs: type=oci,dest=/tmp/capstone-assistive-dispatcher.oci.tar

      - name: Validate and report local OCI image manifest digests
        env:
          BUILD_WORKER: ${{ inputs.build_worker }}
          BUILD_DISPATCHER: ${{ inputs.build_dispatcher }}
        run: |
          set -euo pipefail

          echo "commit: ${{ github.sha }}"
          if [[ "$BUILD_WORKER" == "true" ]]; then
            worker_digest="$(bash tools/assistive-image-digest/validate-oci-image-digest.sh worker /tmp/capstone-assistive-worker.oci.tar)"
            echo "worker digest: $worker_digest"
          else
            echo "worker image: not built (build_worker=false)"
          fi
          if [[ "$BUILD_DISPATCHER" == "true" ]]; then
            dispatcher_digest="$(bash tools/assistive-image-digest/validate-oci-image-digest.sh dispatcher /tmp/capstone-assistive-dispatcher.oci.tar)"
            echo "dispatcher digest: $dispatcher_digest"
          else
            echo "dispatcher image: not built (build_dispatcher=false)"
          fi
          echo "Published: false"

  publish:
    name: Build and publish executor images
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Authenticate to the container registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish heavy assistive worker image
        if: inputs.build_worker
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        id: worker
        with:
          context: .
          file: ./apps/assistive-worker/Dockerfile.hosted
          platforms: linux/amd64
          provenance: false
          push: true
          tags: ghcr.io/${{ github.repository }}/capstone-assistive-worker:${{ github.sha }}

      - name: Build and publish scheduled dispatcher image
        if: inputs.build_dispatcher
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        id: dispatcher
        with:
          context: .
          file: ./apps/assistive-worker/Dockerfile.dispatcher
          platforms: linux/amd64
          provenance: false
          push: true
          tags: ghcr.io/${{ github.repository }}/capstone-assistive-dispatcher:${{ github.sha }}

      - name: Report image digests to pin in infrastructure
        run: |
          echo "commit: ${{ github.sha }}"
          echo "worker digest: ${{ steps.worker.outputs.digest }}"
          echo "dispatcher digest: ${{ steps.dispatcher.outputs.digest }}"
          echo "Published: true"
