name: Supply Chain Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  repository-security:
    name: Repository security policy and secret patterns
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js 24.14.1
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.14.1'

      - name: Run security policy regression tests
        run: node --test tools/security/*.test.mjs

      - name: Scan tracked content for high-signal secret patterns
        run: npm run check:secrets

      - name: Verify workflow and lockfile security policy
        run: npm run check:security-ci

  production-advisory-audit:
    name: Root npm Production Advisory Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js 24.14.1
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.14.1'

      # This is a root-lockfile production advisory check, not a dependency-delta review. It
      # intentionally depends on the npm registry's current advisory service and availability.
      - name: Fail on current high or critical production advisories
        run: npm audit --package-lock-only --omit=dev --audit-level=high
