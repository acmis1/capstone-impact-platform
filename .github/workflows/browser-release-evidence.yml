name: Browser & Release Evidence

on:
  workflow_dispatch:
  schedule:
    # The disposable 120-project publication exercise is intentionally weekly/manual,
    # not part of every push or pull request.
    - cron: '31 4 * * 2'
  push:
    branches: [main]
    paths:
      - '.github/workflows/browser-release-evidence.yml'
      - '.github/workflows/ci.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'apps/admin-cms/package.json'
      - 'apps/admin-cms/src/**'
      - 'docs/accessibility-uat-evidence/**'
      - 'infra/supabase/**'
      - 'Prototype/duda/**'
      - 'Prototype/package.json'
      - 'Prototype/scripts/test-duda-*.js'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/browser-release-evidence.yml'
      - '.github/workflows/ci.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'apps/admin-cms/package.json'
      - 'apps/admin-cms/src/**'
      - 'docs/accessibility-uat-evidence/**'
      - 'infra/supabase/**'
      - 'Prototype/duda/**'
      - 'Prototype/package.json'
      - 'Prototype/scripts/test-duda-*.js'

permissions:
  contents: read

concurrency:
  group: browser-release-evidence-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-contracts:
    name: Loopback Browser & Admin DOM Contracts
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js 24.14.1
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.14.1'

      - name: Install npm 11.11.0 (pinned)
        run: npm install -g npm@11.11.0

      - name: Install dependencies
        run: npm ci

      # These are authenticated-surface component contracts in jsdom with synthetic inputs and
      # mocked requests. They cover keyboard/focus and permission-sensitive rendering, but do not
      # claim a real Auth session, a native screen reader, or end-to-end browser acceptance.
      - name: Verify key Admin interaction contracts without hosted Auth
        run: >-
          npm run test:run --workspace=apps/admin-cms --
          src/components/imports/BrowserImportPreviewClient.browser.test.tsx
          src/components/admin-dashboard/ProjectTableContainer.integration.test.tsx
          src/components/admin-dashboard/BulkProjectReviewPanel.test.tsx
          src/components/admin/ProjectReviewCore.test.tsx
          src/components/admin/ProjectReviewWorkspace.test.tsx
          --maxWorkers=1

      - name: Verify participant preview accessibility and keyboard contracts
        run: >-
          npm run test:run --workspace=apps/admin-cms --
          src/components/admin/ParticipantPreviewPanel.test.tsx
          src/components/admin/ParticipantPreviewPanel.reminders.test.tsx
          src/components/admin/ParticipantCorrectionReview.test.tsx
          src/previews/participantPreviewContrast.test.ts
          src/previews/participantPreviewControlledLinks.test.ts
          src/previews/participantPreviewSnapshotAlt.test.ts
          --maxWorkers=1

      # Revalidates retained evidence integrity and claim boundaries; it does not replay the
      # historical manual browser session or manufacture native assistive-technology evidence.
      - name: Verify retained accessibility UAT evidence integrity
        run: npm run verify:accessibility-uat-evidence

      - name: Verify exact Duda current-feed Chrome contract harness
        run: npm --prefix Prototype run test:duda-current-feed-browser

      - name: Verify 120-record Duda annual-scale renderer
        run: node Prototype/scripts/test-duda-annual-scale-browser.js

  annual-publication:
    name: Disposable 120-Project Publication Evidence
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js 24.14.1
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.14.1'

      - name: Install npm 11.11.0 (pinned)
        run: npm install -g npm@11.11.0

      - name: Install dependencies
        run: npm ci

      # Owns an empty throwaway Local stack, loopback ports, network and workdir. It neither uses
      # secrets nor contacts hosted Supabase, Duda, Render, email, or production publication.
      - name: Verify annual-scale governed publication on disposable Local infrastructure
        run: npm run verify:annual-publication-evidence
        env:
          SUPABASE_START_TIMEOUT_MS: '600000'
