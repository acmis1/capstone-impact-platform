name: CI Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  static-quality:
    name: Static Quality & Build Gates (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    timeout-minutes: 20
    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 24.14.1
        uses: actions/setup-node@v4
        with:
          node-version: '24.14.1'

      - name: Install npm 11.11.0 (pinned)
        run: npm install -g npm@11.11.0

      - name: Verify exact Node.js and npm versions
        run: |
          node -v
          npm -v

      - name: Install dependencies
        run: npm ci

      - name: Onboarding Documentation Contract Check
        run: npm run check:onboarding-docs

      - name: Targeted First Contribution Test
        run: npm run test:run --workspace=apps/admin-cms -- src/components/admin-shell/navigation.test.ts

      - name: Repository terminology check
        run: npm run check:terminology

      - name: GitHub YAML parse check
        run: npm run check:yaml

      - name: Tracked Markdown link check
        run: npm run check:markdown-links

      - name: Public Feed Contract Check
        run: npm run check:feed

      - name: ESLint Quality Check
        run: npm run lint --workspace=apps/admin-cms

      - name: Vitest Unit & Security Tests
        run: npm run test:admin

      - name: TypeScript Typecheck
        run: npm run typecheck:admin

      - name: Next.js Production Build
        run: npm run build:admin

      - name: Portable Diff Whitespace Check
        run: npm run check:diff
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_BEFORE_SHA: ${{ github.event.before }}
          GITHUB_CURRENT_SHA: ${{ github.sha }}

  contributor-rehearsal:
    name: Disposable Contributor Workflow Rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 24.14.1
        uses: actions/setup-node@v4
        with:
          node-version: '24.14.1'

      - name: Install npm 11.11.0 (pinned)
        run: npm install -g npm@11.11.0

      - name: Install dependencies
        run: npm ci

      - name: Onboarding Contributor Workflow Rehearsal
        run: npm run verify:onboarding-workflow

  local-integration:
    name: Disposable Local Supabase Integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 24.14.1
        uses: actions/setup-node@v4
        with:
          node-version: '24.14.1'

      - name: Install npm 11.11.0 (pinned)
        run: npm install -g npm@11.11.0

      - name: Verify exact Node.js and npm versions
        run: |
          node -v
          npm -v

      - name: Install dependencies
        run: npm ci

      - name: Onboarding Toolchain Precheck
        run: npm run onboarding:check

      - name: Run local developer setup
        run: npm run setup:local
        env:
          SUPABASE_START_TIMEOUT_MS: '600000'

      - name: Confirm Local Supabase Stack Running
        run: npm run supabase:assert-running

      - name: Verify thirty-four migrations and local integrity
        run: |
          npm run supabase:verify:local
          test "$(find infra/supabase/migrations -name '*.sql' | wc -l)" -eq 34

      - name: Verify read-only hosted readiness inspection against Local Supabase
        run: npm run verify:hosted-readiness-inspection-runtime

      - name: Verify staff role and session governance runtime behavior
        run: npm exec --workspace=apps/admin-cms -- tsx src/scripts/verifyStaffRoleSessionGovernanceRuntime.ts

      - name: Verify secure password recovery runtime behavior
        run: npm run verify:password-recovery-runtime --workspace=apps/admin-cms

      - name: Verify controlled staff identity provisioning runtime behavior
        run: npm run verify:staff-provisioning-runtime --workspace=apps/admin-cms

      - name: Verify authenticated project detail runtime behavior
        run: npm exec --workspace=apps/admin-cms -- tsx src/scripts/verifyProjectDetailRuntime.ts

      - name: Verify atomic project metadata runtime behavior
        run: npm run verify:metadata-runtime --workspace=apps/admin-cms

      - name: Verify project metadata audit runtime behavior
        run: npm run verify:metadata-audit-runtime --workspace=apps/admin-cms

      - name: Verify review actions runtime behavior
        run: npm run verify:review-actions-runtime --workspace=apps/admin-cms

      - name: Verify atomic browser import metadata stage runtime behavior
        run: npm run verify:browser-metadata-stage-runtime --workspace=apps/admin-cms

      - name: Verify Admin Excel reference reconciliation runtime behavior
        run: npm run verify:admin-excel-reconciliation-runtime --workspace=apps/admin-cms

      - name: Verify atomic browser import media stage runtime behavior
        run: npm run verify:browser-media-stage-runtime --workspace=apps/admin-cms

      - name: Verify atomic import batch review submission runtime behavior
        run: npm run verify:import-batch-review-submit-runtime --workspace=apps/admin-cms

      - name: Verify accessible poster full-text gate runtime behavior
        run: npm run verify:accessibility-full-text-runtime --workspace=apps/admin-cms

      # Runs after the media staging and import-review foundations it builds on, and before the
      # participant preview suite, which consumes the snapshot-alt invariant.
      - name: Verify snapshot image alt text runtime behavior
        run: npm run verify:snapshot-image-alt-text-runtime --workspace=apps/admin-cms

      - name: Verify participant preview links runtime behavior
        run: npm run verify:participant-preview-runtime --workspace=apps/admin-cms

      - name: Verify participant preview notification runtime behavior
        run: npm run verify:participant-preview-notification-runtime --workspace=apps/admin-cms

      - name: Verify participant preview reminder runtime behavior
        run: npm run verify:participant-preview-reminder-runtime --workspace=apps/admin-cms

      - name: Verify publication readiness gate runtime behavior
        run: npm run verify:publication-readiness-runtime --workspace=apps/admin-cms

      - name: Verify publication preparation runtime behavior
        run: npm run verify:publication-preparation-runtime --workspace=apps/admin-cms

      - name: Verify controlled publication runtime behavior
        run: npm run verify:controlled-publication-runtime --workspace=apps/admin-cms

      - name: Verify controlled public removal runtime behavior
        run: npm run verify:controlled-public-removal-runtime --workspace=apps/admin-cms

      - name: Verify approval edit gate runtime behavior
        run: npm run verify:approval-edit-gate-runtime --workspace=apps/admin-cms

      - name: Verify assistive validation persistence runtime behavior
        run: npm run verify:assistive-persistence-runtime --workspace=apps/admin-cms

      - name: Verify Migration 0030 to 0031 assistive upgrade behavior
        run: npm run verify:assistive-upgrade-runtime --workspace=apps/admin-cms

      - name: Verify assistive validation job coordination runtime behavior
        run: npm run verify:assistive-jobs-runtime --workspace=apps/admin-cms

      - name: Verify assistive validation staff inspection runtime behavior
        run: npm run verify:assistive-staff-inspection-runtime --workspace=apps/admin-cms

      - name: Verify assistive duplicate shortlist Migration 0033 runtime behavior
        run: npm run verify:assistive-duplicate-shortlist-runtime --workspace=apps/admin-cms

      - name: Verify bulk project review workflow runtime behavior
        run: npm run verify:bulk-project-review-runtime --workspace=apps/admin-cms

      - name: Admin Application Smoke Test (/api/health & /login 200 OK)
        run: npm run check:app-smoke

      - name: Verify Local Supabase performance and scaling runtime behavior
        run: npm run verify:scaling-runtime --workspace=apps/admin-cms

      - name: Safely rerun local developer setup
        run: npm run setup:local

      - name: Confirm Local Supabase Stack Still Running
        run: npm run supabase:assert-running

      - name: Repository terminology check
        run: npm run check:terminology

      - name: Stop Local Supabase Stack (Cleanup)
        if: always()
        run: npm run supabase:stop

      - name: Confirm Local Supabase Stack Stopped
        if: always()
        run: npm run supabase:assert-stopped
