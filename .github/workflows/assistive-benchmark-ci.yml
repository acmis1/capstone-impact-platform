name: Assistive Benchmark Lightweight CI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/assistive-benchmark-ci.yml'
      - 'tools/assistive-validation-benchmark/**'
      - 'docs/assistive-validation/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/assistive-benchmark-ci.yml'
      - 'tools/assistive-validation-benchmark/**'
      - 'docs/assistive-validation/**'

permissions:
  contents: read

jobs:
  lightweight-benchmark-tests:
    name: Assistive Benchmark Unit & Corpus Gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: tools/assistive-validation-benchmark/pyproject.toml

      - name: Install isolated benchmark dependencies
        run: python -m pip install -e tools/assistive-validation-benchmark

      - name: Run lightweight benchmark unit tests
        working-directory: tools/assistive-validation-benchmark
        run: python -m unittest discover -s tests -v

      - name: Validate committed benchmark manifest
        working-directory: tools/assistive-validation-benchmark
        run: python -m assistive_validation_benchmark validate

      - name: Validate deterministic Phase 6A corpus and manifest hash
        working-directory: tools/assistive-validation-benchmark
        run: python -m assistive_validation_benchmark phase6-validate

      - name: Prove Phase 6A vocabulary provenance and holdout independence
        working-directory: tools/assistive-validation-benchmark
        run: python -m assistive_validation_benchmark phase6-check-policy

      - name: Verify stored Phase 6A evidence and decision contract
        working-directory: tools/assistive-validation-benchmark
        run: python -m assistive_validation_benchmark phase6-check-evidence

      - name: Validate OCR productionization corpus, evidence, decision and boundary
        working-directory: tools/assistive-validation-benchmark
        run: |
          python -m assistive_validation_benchmark.ocr_productionization check
          python -m assistive_validation_benchmark.ocr_productionization check-evidence

      - name: Prove OCR productionization corpus byte determinism
        working-directory: tools/assistive-validation-benchmark
        run: |
          python -m assistive_validation_benchmark.ocr_productionization generate --output-dir artifacts/ocr-repeat-a
          python -m assistive_validation_benchmark.ocr_productionization generate --output-dir artifacts/ocr-repeat-b
          cmp artifacts/ocr-repeat-a/generation.json artifacts/ocr-repeat-b/generation.json

      - name: Generate deterministic synthetic corpus smoke fixture
        working-directory: tools/assistive-validation-benchmark
        run: python -m assistive_validation_benchmark generate --output-dir artifacts/ci-corpus

      - name: Confirm generated/model artifacts remain untracked
        run: git diff --exit-code -- . ':!docs/assistive-validation/evidence/phase-0-report.json'

      - name: Confirm OCR benchmark did not change production paths
        run: |
          git diff --exit-code 284765d7ee820f68dbe6d8122c4b81dfb8e783b2...HEAD -- \
            apps/assistive-worker \
            apps/admin-cms/src/assistive-validation \
            infra/supabase
