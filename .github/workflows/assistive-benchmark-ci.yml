name: Assistive Benchmark Lightweight CI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/assistive-benchmark-ci.yml'
      - 'tools/assistive-validation-benchmark/**'
      - 'docs/assistive-validation/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/assistive-benchmark-ci.yml'
      - 'tools/assistive-validation-benchmark/**'
      - 'docs/assistive-validation/**'

permissions:
  contents: read

jobs:
  lightweight-benchmark-tests:
    name: Assistive Benchmark Unit & Corpus Gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: tools/assistive-validation-benchmark/pyproject.toml

      - name: Install isolated benchmark dependencies
        run: python -m pip install -e tools/assistive-validation-benchmark

      - name: Run lightweight benchmark unit tests
        working-directory: tools/assistive-validation-benchmark
        run: python -m unittest discover -s tests -v

      - name: Validate committed benchmark manifest
        working-directory: tools/assistive-validation-benchmark
        run: python -m assistive_validation_benchmark validate

      - name: Validate deterministic Phase 6A corpus and manifest hash
        working-directory: tools/assistive-validation-benchmark
        run: python -m assistive_validation_benchmark phase6-validate

      - name: Prove Phase 6A vocabulary provenance and holdout independence
        working-directory: tools/assistive-validation-benchmark
        run: python -m assistive_validation_benchmark phase6-check-policy

      - name: Verify stored Phase 6A evidence and decision contract
        working-directory: tools/assistive-validation-benchmark
        run: python -m assistive_validation_benchmark phase6-check-evidence

      - name: Validate Phase 6C calibration and frozen policy evidence
        working-directory: tools/assistive-validation-benchmark
        run: |
          python -m assistive_validation_benchmark.phase6c check-calibration
          python -m assistive_validation_benchmark.phase6c check-calibration-evidence
          python -m assistive_validation_benchmark.phase6c check-freeze-manifest
          python -m assistive_validation_benchmark.phase6c check-freeze-record

      - name: Re-prove the Phase 6C one-shot holdout result without rerunning engines
        working-directory: tools/assistive-validation-benchmark
        run: python -m assistive_validation_benchmark.phase6c check-final-evidence

      - name: Validate OCR productionization evidence and decision
        working-directory: tools/assistive-validation-benchmark
        run: |
          python -m assistive_validation_benchmark.ocr_productionization check-evidence

      # Validates the Iteration 2A diagnostic as historical evidence: stored arithmetic, decision
      # contract and the production boundary recorded at benchmark time. It deliberately does not
      # assert the *current* worker enum, coordinator selection or migration count, so a later
      # legitimate OCR integration cannot invalidate an already-measured iteration. Benchmark PR
      # scope is enforced by the PR-relative production-path diff at the end of this job.
      - name: Validate OCR failure-analysis diagnostic evidence and decision
        working-directory: tools/assistive-validation-benchmark
        run: |
          python -m assistive_validation_benchmark.ocr_failure_analysis check-report

      - name: Prove merged v1 OCR evidence is byte-unchanged
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, sys
          merged = pathlib.Path("docs/assistive-validation/evidence/ocr-productionization-report.json")
          diagnostic = pathlib.Path("docs/assistive-validation/evidence/ocr-productionization-diagnostic-report.json")
          recorded = json.loads(diagnostic.read_text(encoding="utf-8"))["source"]["merged_evidence"]
          observed = hashlib.sha256(merged.read_bytes()).hexdigest()
          if observed != recorded["file_sha256"]:
              sys.exit(f"merged v1 evidence changed: {observed} != {recorded['file_sha256']}")
          if json.loads(merged.read_text(encoding="utf-8"))["final_decision"] != recorded["final_decision"]:
              sys.exit("merged v1 final decision changed")
          print(f"merged v1 evidence unchanged: {observed}")
          PY

      - name: Confirm benchmark PR did not modify frozen OCR history
        if: github.event_name == 'pull_request'
        run: |
          git diff --exit-code "${{ github.event.pull_request.base.sha }}...${{ github.sha }}" -- \
            docs/assistive-validation/evidence/ocr-productionization-report.json \
            docs/assistive-validation/evidence/ocr-productionization-diagnostic-report.json \
            docs/assistive-validation/ocr-productionization-benchmark.md \
            docs/assistive-validation/ocr-productionization-failure-analysis.md \
            docs/assistive-validation/ocr-productionization-iteration2-calibration.md \
            docs/assistive-validation/evidence/ocr-productionization-iteration2-calibration.json \
            tools/assistive-validation-benchmark/ocr-productionization \
            tools/assistive-validation-benchmark/ocr-iteration2-calibration \
            tools/assistive-validation-benchmark/src/assistive_validation_benchmark/ocr_title_consistency \
            tools/assistive-validation-benchmark/src/assistive_validation_benchmark/ocr_title_consistency_holdout \
            tools/assistive-validation-benchmark/src/assistive_validation_benchmark/ocr_title_latency \
            tools/assistive-validation-benchmark/src/assistive_validation_benchmark/ocr_title_latency_holdout \
            tools/assistive-validation-benchmark/ocr-title-consistency-calibration \
            tools/assistive-validation-benchmark/ocr-title-consistency-holdout \
            tools/assistive-validation-benchmark/ocr-title-latency-calibration \
            tools/assistive-validation-benchmark/ocr-title-latency-holdout \
            docs/assistive-validation/evidence/ocr-title-consistency-calibration \
            docs/assistive-validation/evidence/ocr-title-consistency-holdout \
            docs/assistive-validation/evidence/ocr-title-latency-calibration \
            docs/assistive-validation/evidence/ocr-title-latency-holdout

      - name: Prove OCR productionization corpus byte determinism
        working-directory: tools/assistive-validation-benchmark
        run: |
          python -m assistive_validation_benchmark.ocr_productionization generate --output-dir artifacts/ocr-repeat-a
          python -m assistive_validation_benchmark.ocr_productionization generate --output-dir artifacts/ocr-repeat-b
          cmp artifacts/ocr-repeat-a/generation.json artifacts/ocr-repeat-b/generation.json

      - name: Validate OCR Iteration 2 corrected calibration corpus and no-holdout contract
        working-directory: tools/assistive-validation-benchmark
        run: python -m assistive_validation_benchmark.ocr_iteration2_calibration check

      - name: Prove OCR Iteration 2 renderer and corpus byte determinism
        working-directory: tools/assistive-validation-benchmark
        run: |
          python -m assistive_validation_benchmark.ocr_iteration2_calibration generate --output-dir artifacts/ocr2-repeat-a
          python -m assistive_validation_benchmark.ocr_iteration2_calibration generate --output-dir artifacts/ocr2-repeat-b
          cmp artifacts/ocr2-repeat-a/generation.json artifacts/ocr2-repeat-b/generation.json

      - name: Validate OCR Iteration 2 calibration arithmetic and decision
        working-directory: tools/assistive-validation-benchmark
        run: python -m assistive_validation_benchmark.ocr_iteration2_calibration check-report

      # Recomputes the committed development-only correction evidence from its stored captures.
      # It runs no OCR and consumes no fresh holdout.
      - name: Validate OCR Iteration 2 distractor development evidence
        working-directory: tools/assistive-validation-benchmark
        run: python -m assistive_validation_benchmark.ocr_iteration2_holdout_protocol check-development-evidence

      # Iteration 2B2 froze the corrected fresh-holdout protocol. These steps stay cheap on
      # purpose: no PaddlePaddle install, no model download, no neural OCR, no GPU and no holdout
      # creation.
      - name: Validate OCR Iteration 2 holdout protocol freeze and no-holdout contract
        working-directory: tools/assistive-validation-benchmark
        run: python -m assistive_validation_benchmark.ocr_iteration2_holdout_protocol check

      # Cross-platform verification binds the exact toolchain/font/source/fixture identity.
      # Rendered pixels are platform-specific: only the exact Windows profile may generate the
      # holdout, while ubuntu-latest reports its measurement and proves within-run determinism.
      - name: Verify the freeze manifest and renderer environment binding
        working-directory: tools/assistive-validation-benchmark
        run: python -m assistive_validation_benchmark.ocr_iteration2_holdout_protocol verify-freeze

      - name: Prove the canonical renderer reference fixture is deterministic
        working-directory: tools/assistive-validation-benchmark
        run: |
          python -m assistive_validation_benchmark.ocr_iteration2_holdout_protocol fingerprint > ocr2h-fingerprint-a.json
          python -m assistive_validation_benchmark.ocr_iteration2_holdout_protocol fingerprint > ocr2h-fingerprint-b.json
          cmp ocr2h-fingerprint-a.json ocr2h-fingerprint-b.json
          rm ocr2h-fingerprint-a.json ocr2h-fingerprint-b.json

      - name: Verify the stored OCR Iteration 2 holdout protocol-freeze evidence
        working-directory: tools/assistive-validation-benchmark
        run: python -m assistive_validation_benchmark.ocr_iteration2_holdout_protocol check-evidence

      - name: Validate the sealed fresh holdout without generation or OCR
        working-directory: tools/assistive-validation-benchmark
        run: python -m assistive_validation_benchmark.ocr_iteration2_fresh_holdout check-seal

      # Iteration 2B3B consumed the single authorised holdout run. This step re-proves that
      # final result from tracked bytes only: it verifies the byte identity of the preserved
      # state/capture/report, re-scores the tracked capture through the frozen scoring path,
      # requires the recomputed report to equal the tracked report canonically, and requires
      # the decision to remain OCR_PROVIDER_DEFERRED. It stays deliberately cheap: no Paddle
      # runtime, no model download, no network and no OCR. The holdout must never be rerun.
      - name: Re-prove the final OCR Iteration 2 holdout result without OCR
        working-directory: tools/assistive-validation-benchmark
        run: python -m assistive_validation_benchmark.ocr_iteration2_fresh_holdout check-result-evidence

      - name: Validate OCR Iteration 3 calibration corpus and historical non-reuse
        working-directory: tools/assistive-validation-benchmark
        run: python -m assistive_validation_benchmark.ocr_iteration3 check-calibration

      - name: Prove OCR Iteration 3 renderer and calibration byte determinism
        working-directory: tools/assistive-validation-benchmark
        run: |
          python -m assistive_validation_benchmark.ocr_iteration3 generate-calibration --output-dir artifacts/ocr3-repeat-a
          python -m assistive_validation_benchmark.ocr_iteration3 generate-calibration --output-dir artifacts/ocr3-repeat-b
          cmp artifacts/ocr3-repeat-a/generation.json artifacts/ocr3-repeat-b/generation.json

      - name: Recompute OCR Iteration 3 candidate evidence without OCR
        working-directory: tools/assistive-validation-benchmark
        run: |
          python -m assistive_validation_benchmark.ocr_iteration3 check-calibration-evidence
          python -m assistive_validation_benchmark.ocr_iteration3 check-calibration-evidence \
            --capture ../../docs/assistive-validation/evidence/ocr-iteration3/candidate-a-repeat-capture.json \
            --report ../../docs/assistive-validation/evidence/ocr-iteration3/candidate-a-repeat-report.json
          python -m assistive_validation_benchmark.ocr_iteration3 check-candidate-b-evidence
          python -m assistive_validation_benchmark.ocr_iteration3 check-calibration-decision

      # The Iteration 3 one-shot is consumed. This revalidates the seal and state, re-scores
      # the preserved capture, and requires exact equality with the deferred final report.
      # It performs no OCR, loads no Paddle runtime, and must never invoke the one-shot runner.
      - name: Re-prove the final OCR Iteration 3 holdout result without OCR
        working-directory: tools/assistive-validation-benchmark
        run: python -m assistive_validation_benchmark.ocr_iteration3 check-holdout-result

      # Iteration 4 stopped at calibration because the unscored warmup exceeded the frozen
      # timeout. This recomputes the independent-corpus, non-reuse, arithmetic, operational,
      # offline and deferred-decision evidence without installing Paddle or loading the VLM.
      - name: Re-prove the OCR Iteration 4 calibration deferral without OCR
        working-directory: tools/assistive-validation-benchmark
        run: python -m assistive_validation_benchmark.ocr_iteration4 check-calibration-evidence

      # PP1's title-only candidate evidence is intentionally replayed without installing
      # Paddle or loading model weights. These checks cover corpus novelty, deterministic
      # rendering, frozen arithmetic, both preserved calibration attempts and the decision.
      - name: Validate PP1 OCR title-consistency calibration and non-reuse
        working-directory: tools/assistive-validation-benchmark
        run: python -m assistive_validation_benchmark.ocr_title_consistency check-calibration

      - name: Prove PP1 OCR title-consistency renderer determinism
        working-directory: tools/assistive-validation-benchmark
        run: |
          python -m assistive_validation_benchmark.ocr_title_consistency generate-calibration --output-dir artifacts/ocr-title-repeat-a
          python -m assistive_validation_benchmark.ocr_title_consistency generate-calibration --output-dir artifacts/ocr-title-repeat-b
          cmp artifacts/ocr-title-repeat-a/generation.json artifacts/ocr-title-repeat-b/generation.json

      - name: Recompute PP1 OCR title-consistency calibration evidence without OCR
        working-directory: tools/assistive-validation-benchmark
        run: python -m assistive_validation_benchmark.ocr_title_consistency check-calibration-evidence

      # Issue #214's latency evidence is replayed without Paddle or model weights. These
      # checks cover corpus novelty, deterministic rendering, score arithmetic, bounded
      # candidate comparison and the prospective stability-based selection.
      - name: Validate PP1 OCR title-latency calibration and non-reuse
        working-directory: tools/assistive-validation-benchmark
        run: python -m assistive_validation_benchmark.ocr_title_latency check-calibration

      - name: Prove PP1 OCR title-latency renderer determinism
        working-directory: tools/assistive-validation-benchmark
        run: |
          python -m assistive_validation_benchmark.ocr_title_latency generate-calibration --output-dir artifacts/ocr-title-latency-repeat-a
          python -m assistive_validation_benchmark.ocr_title_latency generate-calibration --output-dir artifacts/ocr-title-latency-repeat-b
          cmp artifacts/ocr-title-latency-repeat-a/generation.json artifacts/ocr-title-latency-repeat-b/generation.json

      - name: Recompute PP1 OCR title-latency candidate evidence without OCR
        working-directory: tools/assistive-validation-benchmark
        run: python -m assistive_validation_benchmark.ocr_title_latency check-evidence

      - name: Verify PP1 OCR title-latency candidate freeze
        working-directory: tools/assistive-validation-benchmark
        run: python -m assistive_validation_benchmark.ocr_title_latency check-freeze

      - name: Verify PP1 OCR title-consistency candidate freeze
        working-directory: tools/assistive-validation-benchmark
        run: python -m assistive_validation_benchmark.ocr_title_consistency check-freeze

      # The one authorised fresh holdout run is consumed. This validates the seal, consumed
      # state, stored hashes and exact frozen rescoring without Paddle, model files or OCR.
      - name: Re-prove the final PP1 OCR title-consistency holdout result without OCR
        working-directory: tools/assistive-validation-benchmark
        run: python -m assistive_validation_benchmark.ocr_title_consistency_holdout check-result

      # The Issue #214 holdout is also one-shot. These commands validate its frozen seal,
      # consumed state, score arithmetic and decision without loading Paddle or model files.
      - name: Verify PP1 OCR title-latency holdout seal without OCR
        working-directory: tools/assistive-validation-benchmark
        run: python -m assistive_validation_benchmark.ocr_title_latency_holdout check-seal --allow-consumed

      - name: Re-prove the final PP1 OCR title-latency holdout result without OCR
        working-directory: tools/assistive-validation-benchmark
        run: python -m assistive_validation_benchmark.ocr_title_latency_holdout check-result

      # The corrected full-page iteration replaces PR #215's candidate-selection policy without
      # editing its module or evidence. These steps replay corpus novelty, deterministic
      # rendering, the pre-registered selector decision, all three calibration repeats per
      # candidate, the corrected eligibility/preference rule and the freeze chronology. As with
      # every other OCR step here, no Paddle runtime, model weight, inference or network is used.
      - name: Prove the superseded PP1 OCR title-latency selection policy was not rewritten
        working-directory: tools/assistive-validation-benchmark
        run: |
          python - <<'PY'
          import inspect, sys
          from assistive_validation_benchmark.ocr_title_latency import __main__ as historical
          source = inspect.getsource(historical._selection_eligible)
          if "enable_mkldnn" not in source or "fast_region_ratio" not in source:
              sys.exit("historical title-latency selection rule was modified")
          print("historical _selection_eligible() intact:\n" + source)
          PY

      - name: Validate PP1 OCR full-page title calibration and historical non-reuse
        working-directory: tools/assistive-validation-benchmark
        run: python -m assistive_validation_benchmark.ocr_title_fullpage check-calibration

      - name: Prove PP1 OCR full-page title renderer determinism
        working-directory: tools/assistive-validation-benchmark
        run: |
          python -m assistive_validation_benchmark.ocr_title_fullpage generate-calibration --output-dir artifacts/ocr-title-fullpage-repeat-a
          python -m assistive_validation_benchmark.ocr_title_fullpage generate-calibration --output-dir artifacts/ocr-title-fullpage-repeat-b
          cmp artifacts/ocr-title-fullpage-repeat-a/generation.json artifacts/ocr-title-fullpage-repeat-b/generation.json

      - name: Recompute the PP1 OCR full-page selector decision without OCR
        working-directory: tools/assistive-validation-benchmark
        run: python -m assistive_validation_benchmark.ocr_title_fullpage check-selector-decision

      - name: Recompute PP1 OCR full-page repeated calibration evidence and selection
        working-directory: tools/assistive-validation-benchmark
        run: python -m assistive_validation_benchmark.ocr_title_fullpage check-evidence

      - name: Verify the PP1 OCR full-page candidate freeze and its holdout-absent checkpoint
        working-directory: tools/assistive-validation-benchmark
        run: python -m assistive_validation_benchmark.ocr_title_fullpage check-freeze

      - name: Verify the consumed PP1 OCR full-page v2 seal and one-shot result
        working-directory: tools/assistive-validation-benchmark
        run: |
          python -m assistive_validation_benchmark.ocr_title_fullpage_holdout_v2 check-seal --allow-consumed > /dev/null
          python -m assistive_validation_benchmark.ocr_title_fullpage_holdout_v2 check-result > /dev/null

      - name: Generate deterministic synthetic corpus smoke fixture
        working-directory: tools/assistive-validation-benchmark
        run: python -m assistive_validation_benchmark generate --output-dir artifacts/ci-corpus

      - name: Confirm generated/model artifacts remain untracked
        run: git diff --exit-code -- . ':!docs/assistive-validation/evidence/phase-0-report.json'

      - name: Enforce the one-time READY-gated production boundary
        if: github.event_name == 'pull_request'
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.sha }}"
          result_path="docs/assistive-validation/evidence/ocr-title-fullpage-holdout-v2/holdout-report.json"
          if git cat-file -e "${base}:${result_path}" 2>/dev/null; then
            git diff --exit-code "${base}...${head}" -- \
              apps/assistive-worker \
              apps/admin-cms/src/assistive-validation \
              apps/admin-cms/src/scripts/runAssistiveCoordinator.ts \
              infra/supabase
            exit 0
          fi

          python -m assistive_validation_benchmark.ocr_title_fullpage_holdout_v2 check-result > /dev/null
          mapfile -t changed < <(git diff --name-only "${base}...${head}" -- \
            apps/assistive-worker \
            apps/admin-cms/src/assistive-validation \
            apps/admin-cms/src/scripts/runAssistiveCoordinator.ts \
            infra/supabase)
          unexpected=()
          for path in "${changed[@]}"; do
            case "${path}" in
              apps/assistive-worker/README.md|\
              apps/assistive-worker/pyproject.toml|\
              apps/assistive-worker/uv.lock|\
              apps/assistive-worker/src/capstone_assistive_worker/ocr/paddle_title.py|\
              apps/assistive-worker/src/capstone_assistive_worker/task_cli.py|\
              apps/assistive-worker/src/capstone_assistive_worker/task_contract.py|\
              apps/assistive-worker/tests/test_paddle_title_provider.py|\
              apps/assistive-worker/tests/test_task_contract.py|\
              apps/admin-cms/src/assistive-validation/__tests__/coordinator.test.ts|\
              apps/admin-cms/src/assistive-validation/__tests__/ocrTitleSelector.test.ts|\
              apps/admin-cms/src/assistive-validation/__tests__/pythonWorkerProcess.integration.test.ts|\
              apps/admin-cms/src/assistive-validation/deterministic/ocrTitleSelector.ts|\
              apps/admin-cms/src/assistive-validation/deterministic/titleConsistency.ts|\
              apps/admin-cms/src/assistive-validation/services/assistiveCoordinator.ts|\
              apps/admin-cms/src/assistive-validation/services/pythonWorkerProcess.ts|\
              apps/admin-cms/src/scripts/runAssistiveCoordinator.ts) ;;
              *) unexpected+=("${path}") ;;
            esac
          done
          if (( ${#unexpected[@]} )); then
            printf 'Unexpected production path in the one-time READY-gated integration:\n%s\n' "${unexpected[@]}"
            exit 1
          fi
