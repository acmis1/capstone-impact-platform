name: Assistive Worker Extraction CI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/assistive-worker-ci.yml'
      - 'apps/assistive-worker/**'
      - 'apps/admin-cms/src/assistive-validation/**'
      - 'infra/supabase/migrations/20260820160000_assistive_validation_job_coordination.sql'
      - 'infra/supabase/migrations/20260828120000_assistive_worker_heartbeat.sql'
      - 'render.yaml'
      - 'docs/assistive-validation/phase-1-document-extraction.md'
      - 'docs/assistive-validation/phase-4-async-job-coordination.md'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/assistive-worker-ci.yml'
      - 'apps/assistive-worker/**'
      - 'apps/admin-cms/src/assistive-validation/**'
      - 'infra/supabase/migrations/20260820160000_assistive_validation_job_coordination.sql'
      - 'infra/supabase/migrations/20260828120000_assistive_worker_heartbeat.sql'
      - 'render.yaml'
      - 'docs/assistive-validation/phase-1-document-extraction.md'
      - 'docs/assistive-validation/phase-4-async-job-coordination.md'

permissions:
  contents: read

jobs:
  extraction-tests:
    name: Production Extraction & Security Gates
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: apps/assistive-worker/pyproject.toml

      - name: Setup Node.js 24.14.1
        uses: actions/setup-node@v4
        with:
          node-version: '24.14.1'
          cache: 'npm'

      - name: Install production extraction package
        run: python -m pip install -e apps/assistive-worker

      - name: Install repository dependencies
        run: npm ci

      - name: Run production extraction tests
        working-directory: apps/assistive-worker
        run: python -m unittest discover -s tests -v

      - name: Run production Node-to-Python process integration
        run: npm exec --workspace=apps/admin-cms -- vitest run src/assistive-validation/__tests__/pythonWorkerProcess.integration.test.ts
        env:
          ASSISTIVE_PROCESS_INTEGRATION: '1'
          ASSISTIVE_TEST_PYTHON: python

      - name: Generate deterministic golden fixtures
        working-directory: apps/assistive-worker
        run: python tests/fixtures/generate.py --output-dir "${{ runner.temp }}/capstone-phase1-fixtures"

      - name: Confirm generated artifacts remain untracked
        run: git diff --exit-code
