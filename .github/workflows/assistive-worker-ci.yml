name: Assistive Worker Extraction CI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/assistive-worker-ci.yml'
      - 'apps/assistive-worker/**'
      - 'docs/assistive-validation/phase-1-document-extraction.md'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/assistive-worker-ci.yml'
      - 'apps/assistive-worker/**'
      - 'docs/assistive-validation/phase-1-document-extraction.md'

permissions:
  contents: read

jobs:
  extraction-tests:
    name: Production Extraction & Security Gates
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: apps/assistive-worker/pyproject.toml

      - name: Install production extraction package
        run: python -m pip install -e apps/assistive-worker

      - name: Run production extraction tests
        working-directory: apps/assistive-worker
        run: python -m unittest discover -s tests -v

      - name: Generate deterministic golden fixtures
        working-directory: apps/assistive-worker
        run: python tests/fixtures/generate.py --output-dir "${{ runner.temp }}/capstone-phase1-fixtures"

      - name: Confirm generated artifacts remain untracked
        run: git diff --exit-code
