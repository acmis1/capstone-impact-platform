services:
  - type: worker
    name: capstone-assistive-worker-staging
    runtime: docker
    region: singapore
    plan: 2c-4g
    numInstances: 1
    autoDeploy: false
    maxShutdownDelaySeconds: 300
    dockerContext: .
    dockerfilePath: ./apps/assistive-worker/Dockerfile.hosted
    envVars:
      - key: CAPSTONE_RUNTIME_ENV
        value: staging
      - key: CAPSTONE_ASSISTIVE_HOSTED_EXECUTION_ENABLED
        value: "true"
      - key: CAPSTONE_EXPECTED_SUPABASE_HOST
        sync: false
      - key: CAPSTONE_ASSISTIVE_SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: CAPSTONE_ASSISTIVE_PADDLE_MODELS_DIR
        value: /opt/capstone/artifacts/paddle
      - key: CAPSTONE_ASSISTIVE_LANGUAGETOOL_ARCHIVE
        value: /opt/capstone/artifacts/languagetool/LanguageTool-stable.zip
      - key: CAPSTONE_ASSISTIVE_LANGUAGETOOL_JAR
        value: /opt/capstone/artifacts/languagetool/LanguageTool-6.6/languagetool-server.jar
