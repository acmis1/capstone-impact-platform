[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "capstone-assistive-worker"
version = "0.1.0"
description = "Bounded local document extraction for PP1 assistive validation"
requires-python = ">=3.11,<3.14"
dependencies = [
  "Pillow==12.3.0",
  "pypdfium2==5.13.0",
]

[project.optional-dependencies]
paddle-title = [
  "paddleocr==3.7.0",
  "paddlepaddle==3.3.0",
  "paddlex[ocr-core]==3.7.2",
]

[project.scripts]
capstone-assistive-extract = "capstone_assistive_worker.cli:main"
capstone-assistive-task = "capstone_assistive_worker.task_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
